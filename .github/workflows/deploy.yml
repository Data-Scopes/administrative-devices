name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served at the custom domain in public/CNAME. Repository variables can override these
      # (Settings → Secrets and variables → Actions → Variables), e.g. SITE_URL=https://data-scopes.github.io
      # and BASE_PATH=/administrative-devices to serve without the domain.
      SITE_URL: ${{ vars.SITE_URL || 'https://administrative-devices.org' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      HAS_SYNC_TOKEN: ${{ secrets.SUBPROJECT_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Optional: pull site/summary.md from each sub-project repo (PLAN.md, "Summaries synced ...").
      # Needs a fine-grained PAT with read-only access to contents of those repos, stored as a secret.
      - name: Sync sub-project summaries
        env:
          GITHUB_TOKEN: ${{ secrets.SUBPROJECT_READ_TOKEN }}
        if: ${{ env.HAS_SYNC_TOKEN == 'true' }}
        run: npm run sync

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
