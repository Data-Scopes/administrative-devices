<svg width="256" height="256" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- index card, left: a list with one entry highlighted -->
  <rect x="6" y="34" width="34" height="46" rx="4" fill="none" stroke="#21262B" stroke-width="4"/>
  <line x1="14" y1="46" x2="32" y2="46" stroke="#21262B" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="57" x2="32" y2="57" stroke="#2C5F7C" stroke-width="4" stroke-linecap="round"/>
  <line x1="14" y1="68" x2="32" y2="68" stroke="#21262B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="12" cy="57" r="3.5" fill="#2C5F7C"/>

  <!-- document, right: page with a folded corner -->
  <path d="M78,30 h26 l10,10 v50 h-36 z" fill="none" stroke="#21262B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104,30 v10 h10 z" fill="#21262B"/>
  <line x1="84" y1="56" x2="106" y2="56" stroke="#21262B" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="66" x2="106" y2="66" stroke="#21262B" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="76" x2="98" y2="76" stroke="#21262B" stroke-width="3" stroke-linecap="round"/>

  <!-- connecting reference, arcing from the highlighted entry to the document -->
  <path d="M40,57 C58,20 62,20 79,50" fill="none" stroke="#2C5F7C" stroke-width="4" stroke-linecap="round"/>
  <path d="M79,50 l-9,-3 l3,9 z" fill="#2C5F7C"/>
</svg>
